# Builds Folio and runs every test on each push and pull request to main.
# Actions are pinned to full commit SHAs (the comment shows the version); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Folio.slnx

      - name: Build
        run: dotnet build Folio.slnx --configuration Release --no-restore

      # The optional live Finnhub test skips itself without FINNHUB_KEY, so CI needs no secrets.
      - name: Test
        run: dotnet test Folio.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Check for vulnerable packages
        run: |
          dotnet list Folio.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -i "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A package has a known vulnerability (see above)."
            exit 1
          fi
